name: Publish Tauri desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.108.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build Tauri Desktop (Windows)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read engine.pin
        id: engine_pin
        shell: bash
        env:
          HAS_ENGINE_KEY: ${{ secrets.ENGINE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_ENGINE_KEY" != "true" ]; then
            echo "::error::ENGINE_DEPLOY_KEY is not set — the official desktop sidecar cannot be built without the engine."
            exit 1
          fi
          REF=$(jq -r .ref engine.pin)
          if ! echo "$REF" | grep -Eq '^[0-9a-f]{40}$|^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::engine.pin ref '$REF' is not a full commit SHA or a v<x.y.z> tag"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out the engine at engine.pin
        uses: actions/checkout@v4
        with:
          repository: agentistics/agentistics-engine
          ref: ${{ steps.engine_pin.outputs.ref }}
          path: .engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile --cwd packages/desktop

      - name: Install + link the engine
        working-directory: .engine
        env:
          AGENTISTICS_PUBLIC_DIR: ..
        run: bun install --frozen-lockfile

      # The release workflow deliberately publishes only Linux assets. Build the Windows sidecar
      # in this independently rerunnable workflow before the unchanged Tauri build steps consume it.
      - name: Set version
        shell: bash
        run: |
          VERSION="${TAG#v}"
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Desktop build version set to $VERSION"

      - name: Download the Windows agentop sidecar from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/desktop/binaries
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern agentop.exe --output packages/desktop/binaries/agentop.exe
          test -s packages/desktop/binaries/agentop.exe

      - name: Copy logo for loading screen
        shell: bash
        run: cp packages/web/public/minimalistLogo.png packages/desktop/ui/logo.png

      - name: Build Tauri app
        working-directory: packages/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bunx tauri build --target x86_64-pc-windows-msvc

      - name: Check for updater signature
        id: check_sig
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SIG_FILE=$(find "$BUNDLE" -maxdepth 1 -name "*.exe.sig" 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            echo "has_sig=true" >> $GITHUB_OUTPUT
          else
            echo "has_sig=false" >> $GITHUB_OUTPUT
            echo "::warning title=Auto-updater disabled::No .exe.sig produced — latest.json will not be generated and the native Tauri updater cannot detect this release. Check that the TAURI_SIGNING_PRIVATE_KEY secret is set AND that bundle.createUpdaterArtifacts is true in tauri.conf.json. (The in-app update banner still works.)"
          fi

      - name: Generate latest.json for auto-updater
        if: steps.check_sig.outputs.has_sig == 'true'
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          EXE=$(find "$BUNDLE" -maxdepth 1 -name "*.exe" ! -name "*.sig" | head -1)
          SIG=$(cat ${EXE}.sig)
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          FILENAME=$(basename "$EXE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${TAG} for full changelog.",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"
              }
            }
          }
          EOF

      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SIG_FILES=$(find "$BUNDLE" -maxdepth 1 -name "*.exe.sig" 2>/dev/null || true)
          LATEST_JSON=$([ -f /tmp/latest.json ] && echo /tmp/latest.json || true)
          gh release upload "$TAG" \
            $BUNDLE/*.exe \
            $SIG_FILES \
            $LATEST_JSON \
            --clobber || true
