name: Build & Release

on:
  push:
    branches: [main, feat/desktop]
  # The manual valve. The version is otherwise computed from the tags and the commit subjects, which
  # is right almost always and has no answer for the case where it got the number WRONG: 1.8.2 went
  # out carrying a whole cockpit because the bump glob did not match scoped commits, and nothing
  # short of inventing a commit could correct it. Given a version here, that computation is skipped
  # entirely and this is the number that ships.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release exactly this version (e.g. 1.9.0). Leave empty to compute it.'
        required: false
        type: string

permissions:
  contents: write
  actions: write  # dispatch the independent publish workflows (GITHUB_TOKEN does not emit release events)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build binary (Linux x64)
    runs-on: ubuntu-latest
    env:
      # THE OFFICIAL BUILD carries the private engine (engine-interface spec §8/§9). It is official
      # only in THIS repository and only on `main` (a push or a dispatch run from it) or a tag —
      # never on a fork, never for a pull request (this workflow has no `pull_request` trigger and
      # must never gain a `pull_request_target` one: that would hand the deploy key to a stranger's
      # code). Everywhere else the build is the community one and nothing below asks for the key.
      OFFICIAL: ${{ github.repository == 'agentistics/agentistics' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      # The packages a release stamps its version onto, in ONE place.
      #
      # `packages/vscode` is deliberately ABSENT. The extension is versioned on its own line: it
      # ships to a marketplace on its own cadence, its users upgrade it independently of the binary,
      # and a version that jumped every time the server released would say nothing about what
      # changed in the editor. Bump it by hand in `packages/vscode/package.json`.
      #
      # There were two lists: the bump script wrote the files and `git add` staged them, and they
      # were not the same list. Adding `packages/tui` to the first alone meant the file was written
      # in the runner's working tree and thrown away — which is why the tui package went out at
      # 1.7.3 in the 1.9.0 release, reporting a version no release has ever produced. Two hardcoded
      # lists that must agree is the shape of the bug, not the fix.
      PKG_FILES: >-
        package.json
        packages/core/package.json
        packages/server/package.json
        packages/web/package.json
        packages/mcp/package.json
        packages/tui/package.json
        packages/agentop/package.json
    outputs:
      skip: ${{ steps.skip_check.outputs.skip }}
      version_skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      next: ${{ steps.version.outputs.next }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if version bump commit
        id: skip_check
        run: |
          # A FORCED release is never skipped. This guard exists so the workflow's own bump commit
          # does not trigger it again; the head of main is always that commit, so honouring it on a
          # manual dispatch would refuse every corrective release outright.
          # tformat:, like every other read in this file — see the note on the bump step. `$(…)`
          # strips the trailing newline either way, which is exactly why the wrong form survives
          # here unnoticed and gets copied into a loop where it drops a record.
          MSG=$(git log -1 --pretty=tformat:"%s")
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -q "chore: bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.skip_check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.skip_check.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Ensure type stub
        if: steps.skip_check.outputs.skip != 'true'
        run: bun run stub

      - name: Type check
        if: steps.skip_check.outputs.skip != 'true'
        run: bun tsc --noEmit

      - name: Run tests
        if: steps.skip_check.outputs.skip != 'true'
        run: bun test

      - name: Determine next version
        if: steps.skip_check.outputs.skip != 'true'
        id: version
        run: |
          # An explicitly requested version wins outright: no tag arithmetic, no subject parsing, and
          # no "no new commits" skip — a corrective release exists precisely because the automatic
          # answer was wrong, so consulting it again would refuse the correction.
          FORCED="${{ github.event.inputs.version }}"
          if [ -n "$FORCED" ]; then
            FORCED="${FORCED#v}"
            case "$FORCED" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::version must look like 1.9.0, got '$FORCED'"; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v$FORCED" >/dev/null; then
              echo "::error::v$FORCED already exists"; exit 1
            fi
            echo "next=$FORCED"  >> $GITHUB_OUTPUT
            echo "tag=v$FORCED"  >> $GITHUB_OUTPUT
            echo "range=HEAD~20..HEAD" >> $GITHUB_OUTPUT
            echo "bump=forced"   >> $GITHUB_OUTPUT
            echo "skip=false"    >> $GITHUB_OUTPUT
            echo "▶ forced release v$FORCED"
            exit 0
          fi

          # Last semver tag only (ignore 'latest')
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            CURRENT="0.0.0"
            RANGE="HEAD"
          else
            CURRENT="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi

          # Check if there are any commits to release
          COMMIT_COUNT=$(git log $RANGE --oneline 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since $LAST_TAG — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine the bump and the next version from the range's conventional commits.
          #
          # The classification is NOT inlined here any more — it lives in @agentistics/core
          # (`bumpFromCommits` / `nextVersion`), the ONE tested implementation, and this step reads
          # the commits and delegates. Two things this step gets right that the old inline loop did
          # not:
          #   - `--pretty=tformat:` (NOT `format:`). `format:` omits the terminal newline on the
          #     LAST record, and `while read` silently drops a final line without one — so the
          #     OLDEST commit in the range was never classified. When that was the only `feat`,
          #     the bump fell to the silent `patch` default and a feature shipped as v1.23.1.
          #   - a NOISY failure. `bumpFromCommits` throws when it is handed nothing to classify, so
          #     a range with commits but zero readable subjects aborts the release loudly instead
          #     of quietly emitting a patch. The `if !` below turns that throw into a failed job.
          #
          # Records are `%s <US> %b <RS>` so a multi-line body survives; core scans the body for a
          # `BREAKING CHANGE` footer, which the old subject-only read could not see.
          if ! RESULT=$(git log "$RANGE" --pretty=tformat:'%s%x1f%b%x1e' | CURRENT="$CURRENT" bun -e '
            import { bumpFromCommits, nextVersion } from "@agentistics/core"
            const raw = await Bun.stdin.text()
            const commits = raw.split("\x1e").map((r) => r.trim()).filter(Boolean).map((r) => {
              const [subject = "", ...body] = r.split("\x1f")
              return { subject: subject.trim(), body: body.join("\x1f").trim() }
            })
            const bump = bumpFromCommits(commits)
            process.stdout.write(nextVersion(process.env.CURRENT, bump) + " " + bump)
          '); then
            echo "::error::version bump calculation failed for range ${RANGE} — the range has commits but none could be classified (reading defect). Refusing to guess a version."
            exit 1
          fi
          NEXT="${RESULT%% *}"
          BUMP="${RESULT##* }"

          # The release group serializes normal runs, but an explicit dispatch or a pre-existing
          # remote tag must still fail before any version-bump commit is pushed.
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::v$NEXT already exists; refusing to create a duplicate release"
            exit 1
          fi

          echo "current=$CURRENT"    >> $GITHUB_OUTPUT
          echo "next=$NEXT"          >> $GITHUB_OUTPUT
          echo "tag=v$NEXT"          >> $GITHUB_OUTPUT
          echo "range=$RANGE"        >> $GITHUB_OUTPUT
          echo "bump=$BUMP"          >> $GITHUB_OUTPUT
          echo "skip=false"          >> $GITHUB_OUTPUT
          echo "▶ $CURRENT → $NEXT  (bump: $BUMP, $COMMIT_COUNT commits)"


      # ── The engine ─────────────────────────────────────────────────────────────────────────────
      # Checked out AFTER the type check and the tests on purpose: those prove the public tree on its
      # own (the engine's CI proves the pair), and a checkout inside the workspace before `bun test`
      # would have the root test run pick up the engine's own suite. `.engine/` is gitignored and is
      # not a workspace (`packages/*`), so `bun install --frozen-lockfile` above never saw it.
      #
      # The ONE secret: ENGINE_DEPLOY_KEY — the private half of a READ-ONLY deploy key registered on
      # agentistics/agentistics-engine (and nowhere else). It grants nothing but reading that one
      # repository and survives this repository changing owner. Its absence on an official run is a
      # FAILED release, never a quiet community binary.
      - name: Read engine.pin
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        id: engine_pin
        env:
          HAS_ENGINE_KEY: ${{ secrets.ENGINE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_ENGINE_KEY" != "true" ]; then
            echo "::error::ENGINE_DEPLOY_KEY is not set — an official release cannot be built without the engine. Add the read-only deploy key of agentistics/agentistics-engine as this repository's ENGINE_DEPLOY_KEY secret."
            exit 1
          fi
          REF=$(jq -r .ref engine.pin)
          if ! echo "$REF" | grep -Eq '^[0-9a-f]{40}$|^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::engine.pin ref '$REF' is not a full commit SHA or a v<x.y.z> tag"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "▶ engine pinned at $REF (api $(jq -r .api engine.pin))"

      - name: Check out the engine at engine.pin
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: agentistics/agentistics-engine
          ref: ${{ steps.engine_pin.outputs.ref }}
          path: .engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      # The engine resolves `@agentistics/core` / `@agentistics/engine-api` from THIS checkout: its
      # postinstall (scripts/link-public.ts) links them from AGENTISTICS_PUBLIC_DIR.
      - name: Install + link the engine
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        working-directory: .engine
        env:
          AGENTISTICS_PUBLIC_DIR: ..
        run: bun install --frozen-lockfile

      - name: Bump version in package.json
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          bun -e "
            const fs = require('fs');
            const targets = process.env.PKG_FILES.split(' ').filter(Boolean);
            for (const f of targets) {
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Build frontend (Vite)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun run build

      # `build:assets` also regenerates the engine slot (packages/server/scripts/engine-slot.ts),
      # pointed at `.engine` on the official build, so both Linux binaries compiled below carry it.
      - name: Embed frontend assets
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          AGENTISTICS_ENGINE_DIR: ${{ env.OFFICIAL == 'true' && '.engine' || '' }}
        run: |
          bun run build:assets
          if [ "$OFFICIAL" = "true" ] && ! grep -q "engineSlot = 'dir'" packages/server/server/engine-slot.generated.ts; then
            echo "::error::the engine slot does not point at the checked-out engine — refusing to build an official binary without it"
            exit 1
          fi

      # EVERY compile below is `--minify` (whitespace + syntax + identifiers) and NONE takes
      # `--sourcemap`: these binaries are public (GitHub Releases), and an
      # unminified bundle carries the engine's source readable, module paths and all. Obfuscation
      # beyond minify is a separate, later decision. The smoke step greps the result for marker
      # strings an unminified engine carries (packages/server/scripts/assert-official-engine.ts).
      - name: Compile binary
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          mkdir -p release
          bun build --compile --minify packages/server/bin/cli.ts --outfile ./release/agentop

      # Alpine and other musl-based distros have no glibc dynamic linker at all — the glibc binary
      # above fails there with a bare "not found" that names no missing library (the kernel is
      # looking for /lib64/ld-linux-x86-64.so.2, which does not exist, and the shell reports that
      # ENOENT as though the file itself were missing). install.sh picks between the two by
      # checking `ldd --version` for "musl". Cross-compiled from this same glibc runner — Bun
      # downloads the musl runtime for the target rather than needing one installed here.
      - name: Compile musl binary (cross-compile)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun build --compile --minify --target=bun-linux-x64-musl packages/server/bin/cli.ts --outfile ./release/agentop-musl

      - name: Smoke test
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: ./release/agentop --help

      # THE RELEASE FAILS IF THE ENGINE IS ABSENT. `--version` must print `engine <v> (api <x.y.z>)`
      # where <v> is the checked-out engine's own version and <x.y.z> satisfies engine.pin's range.
      - name: Smoke test — the official binary carries the pinned engine, minified
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun packages/server/scripts/assert-official-engine.ts ./release/agentop --engine-dir .engine

      # The runner is glibc, so the musl binary needs a real musl system for its smoke test.
      - name: Smoke test (musl)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          docker run --rm -e OFFICIAL="$OFFICIAL" -v "$(pwd)/release:/release:ro" alpine:latest sh -c '
            apk add --no-cache libstdc++ libgcc >/dev/null &&
            cp /release/agentop-musl /tmp/agentop-musl &&
            chmod +x /tmp/agentop-musl &&
            /tmp/agentop-musl --help >/dev/null &&
            if [ "$OFFICIAL" = "true" ]; then
              /tmp/agentop-musl --version | grep -Eq "^engine [0-9]" || { echo "::error::the musl binary carries no engine"; exit 1; }
            fi
          '

      - name: Generate changelog
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          RANGE="${{ steps.version.outputs.range }}"
          VERSION="${{ steps.version.outputs.next }}"

          {
            echo "## What's changed in v${VERSION}"
            echo ""

            # `tformat:` (not `format:`) so the last record carries a terminal newline — otherwise
            # `while read` drops the oldest commit in the range and it vanishes from the changelog.
            git log "$RANGE" --pretty=tformat:"%s|%H" | while IFS='|' read -r subject sha; do
              short="${sha:0:7}"
              url="https://github.com/${{ github.repository }}/commit/${sha}"
              case "$subject" in
                feat:*)     echo "- ✨ ${subject#feat: } ([\`$short\`]($url))" ;;
                fix:*)      echo "- 🐛 ${subject#fix: } ([\`$short\`]($url))" ;;
                perf:*)     echo "- ⚡ ${subject#perf: } ([\`$short\`]($url))" ;;
                refactor:*) echo "- ♻️  ${subject#refactor: } ([\`$short\`]($url))" ;;
                chore:*)    echo "- 🔧 ${subject#chore: } ([\`$short\`]($url))" ;;
                docs:*)     echo "- 📚 ${subject#docs: } ([\`$short\`]($url))" ;;
                test:*)     echo "- 🧪 ${subject#test: } ([\`$short\`]($url))" ;;
                ci:*)       echo "- 👷 ${subject#ci: } ([\`$short\`]($url))" ;;
                *)          echo "- ${subject} ([\`$short\`]($url))" ;;
              esac
            done

            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo ""
            echo "Built from commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})."
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Commit version bump and create tag
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PKG_FILES
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "$TAG"
          git push origin main "$TAG"

      # CARRY THE BUMP BACK TO `dev`. The step above commits the new version on `main` and nothing
      # ever brought it home, so `dev`'s own `package.json` stayed at whatever it said the last time
      # a bump reached it — 2.35.1, while `main` shipped 2.48.1, with 34 bump commits between them.
      # A build from `dev` serves the right CODE and stamps a version months old, so `/api/version`
      # reads as an old release: measured on this machine, a shipped feature was reported missing
      # four separate times because that number was the only evidence anybody had.
      #
      # A merge, not a cherry-pick: `main` receives nothing but merges of `dev` plus these bump
      # commits, so merging it into `dev` carries the bumps and nothing else. A CONFLICT is left
      # alone and announced — the release itself already succeeded, and a workflow that force-pushes
      # its way into a branch people are committing to is worse than a version number that lags.
      - name: Carry the version bump back to dev
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NEVER FATAL. Features now reach `main` straight from their work branches as well as `dev`,
        # so `dev` routinely moves while a release is running, and the push below was rejected as a
        # non-fast-forward — which failed the whole job AFTER the version was bumped and tagged, so
        # the release was never published. Refetch and retry a few times; if
        # it still cannot land, warn and let the release publish — a lagging version number on `dev`
        # is the cost this step's own comment above already accepts.
        run: |
          carried=false
          for attempt in 1 2 3; do
            git fetch origin dev
            git checkout -B dev origin/dev
            if git merge --no-edit main; then
              if git push origin dev; then
                echo "▶ carried ${{ steps.version.outputs.next }} back to dev"
                carried=true
                break
              fi
              echo "push to dev rejected (attempt $attempt) — dev moved; refetching"
              sleep $((attempt * 5))
            else
              git merge --abort
              echo "::warning::could not merge main into dev — dev keeps its old version number until somebody merges it by hand"
              carried=true
              break
            fi
          done
          if [ "$carried" != true ]; then
            echo "::warning::could not push the version bump to dev after 3 attempts — dev keeps its old version number until somebody merges main into it"
          fi
          git checkout main

      - name: Publish versioned release
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.next }}"

          # The release is created with GITHUB_TOKEN, so its published event cannot trigger another
          # workflow. Dispatch the two independent publishers explicitly after the release exists.
          gh release create "$TAG" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            ./release/agentop \
            ./release/agentop-musl

          gh workflow run publish-npm.yml --ref main --field tag="$TAG"
          gh workflow run publish-tauri.yml --ref main --field tag="$TAG"
