name: Build & Release

on:
  push:
    branches: [main, feat/desktop]
  # The manual valve. The version is otherwise computed from the tags and the commit subjects, which
  # is right almost always and has no answer for the case where it got the number WRONG: 1.8.2 went
  # out carrying a whole cockpit because the bump glob did not match scoped commits, and nothing
  # short of inventing a commit could correct it. Given a version here, that computation is skipped
  # entirely and this is the number that ships.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release exactly this version (e.g. 1.9.0). Leave empty to compute it.'
        required: false
        type: string

permissions:
  contents: write
  packages: write  # push the central Docker image to GHCR (publish-image job)

jobs:
  build:
    name: Build binary (Linux x64)
    runs-on: ubuntu-latest
    env:
      # THE OFFICIAL BUILD carries the private engine (engine-interface spec §8/§9). It is official
      # only in THIS repository and only on `main` (a push or a dispatch run from it) or a tag —
      # never on a fork, never for a pull request (this workflow has no `pull_request` trigger and
      # must never gain a `pull_request_target` one: that would hand the deploy key to a stranger's
      # code). Everywhere else the build is the community one and nothing below asks for the key.
      OFFICIAL: ${{ github.repository == 'agentistics/agentistics' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      # The packages a release stamps its version onto, in ONE place.
      #
      # `packages/vscode` is deliberately ABSENT. The extension is versioned on its own line: it
      # ships to a marketplace on its own cadence, its users upgrade it independently of the binary,
      # and a version that jumped every time the server released would say nothing about what
      # changed in the editor. Bump it by hand in `packages/vscode/package.json`.
      #
      # There were two lists: the bump script wrote the files and `git add` staged them, and they
      # were not the same list. Adding `packages/tui` to the first alone meant the file was written
      # in the runner's working tree and thrown away — which is why the tui package went out at
      # 1.7.3 in the 1.9.0 release, reporting a version no release has ever produced. Two hardcoded
      # lists that must agree is the shape of the bug, not the fix.
      PKG_FILES: >-
        package.json
        packages/core/package.json
        packages/runtime/package.json
        packages/server/package.json
        packages/web/package.json
        packages/mcp/package.json
        packages/tui/package.json
        packages/agentop/package.json
    outputs:
      skip: ${{ steps.skip_check.outputs.skip }}
      version_skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      next: ${{ steps.version.outputs.next }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if version bump commit
        id: skip_check
        run: |
          # A FORCED release is never skipped. This guard exists so the workflow's own bump commit
          # does not trigger it again; the head of main is always that commit, so honouring it on a
          # manual dispatch would refuse every corrective release outright.
          # tformat:, like every other read in this file — see the note on the bump step. `$(…)`
          # strips the trailing newline either way, which is exactly why the wrong form survives
          # here unnoticed and gets copied into a loop where it drops a record.
          MSG=$(git log -1 --pretty=tformat:"%s")
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -q "chore: bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.skip_check.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.skip_check.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Ensure type stub
        if: steps.skip_check.outputs.skip != 'true'
        run: bun run stub

      - name: Type check
        if: steps.skip_check.outputs.skip != 'true'
        run: bun tsc --noEmit

      - name: Run tests
        if: steps.skip_check.outputs.skip != 'true'
        run: bun test

      - name: Determine next version
        if: steps.skip_check.outputs.skip != 'true'
        id: version
        run: |
          # An explicitly requested version wins outright: no tag arithmetic, no subject parsing, and
          # no "no new commits" skip — a corrective release exists precisely because the automatic
          # answer was wrong, so consulting it again would refuse the correction.
          FORCED="${{ github.event.inputs.version }}"
          if [ -n "$FORCED" ]; then
            FORCED="${FORCED#v}"
            case "$FORCED" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::version must look like 1.9.0, got '$FORCED'"; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v$FORCED" >/dev/null; then
              echo "::error::v$FORCED already exists"; exit 1
            fi
            echo "next=$FORCED"  >> $GITHUB_OUTPUT
            echo "tag=v$FORCED"  >> $GITHUB_OUTPUT
            echo "range=HEAD~20..HEAD" >> $GITHUB_OUTPUT
            echo "bump=forced"   >> $GITHUB_OUTPUT
            echo "skip=false"    >> $GITHUB_OUTPUT
            echo "▶ forced release v$FORCED"
            exit 0
          fi

          # Last semver tag only (ignore 'latest')
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            CURRENT="0.0.0"
            RANGE="HEAD"
          else
            CURRENT="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          fi

          # Check if there are any commits to release
          COMMIT_COUNT=$(git log $RANGE --oneline 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits since $LAST_TAG — skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine the bump and the next version from the range's conventional commits.
          #
          # The classification is NOT inlined here any more — it lives in @agentistics/core
          # (`bumpFromCommits` / `nextVersion`), the ONE tested implementation, and this step reads
          # the commits and delegates. Two things this step gets right that the old inline loop did
          # not:
          #   - `--pretty=tformat:` (NOT `format:`). `format:` omits the terminal newline on the
          #     LAST record, and `while read` silently drops a final line without one — so the
          #     OLDEST commit in the range was never classified. When that was the only `feat`,
          #     the bump fell to the silent `patch` default and a feature shipped as v1.23.1.
          #   - a NOISY failure. `bumpFromCommits` throws when it is handed nothing to classify, so
          #     a range with commits but zero readable subjects aborts the release loudly instead
          #     of quietly emitting a patch. The `if !` below turns that throw into a failed job.
          #
          # Records are `%s <US> %b <RS>` so a multi-line body survives; core scans the body for a
          # `BREAKING CHANGE` footer, which the old subject-only read could not see.
          if ! RESULT=$(git log "$RANGE" --pretty=tformat:'%s%x1f%b%x1e' | CURRENT="$CURRENT" bun -e '
            import { bumpFromCommits, nextVersion } from "@agentistics/core"
            const raw = await Bun.stdin.text()
            const commits = raw.split("\x1e").map((r) => r.trim()).filter(Boolean).map((r) => {
              const [subject = "", ...body] = r.split("\x1f")
              return { subject: subject.trim(), body: body.join("\x1f").trim() }
            })
            const bump = bumpFromCommits(commits)
            process.stdout.write(nextVersion(process.env.CURRENT, bump) + " " + bump)
          '); then
            echo "::error::version bump calculation failed for range ${RANGE} — the range has commits but none could be classified (reading defect). Refusing to guess a version."
            exit 1
          fi
          NEXT="${RESULT%% *}"
          BUMP="${RESULT##* }"

          echo "current=$CURRENT"    >> $GITHUB_OUTPUT
          echo "next=$NEXT"          >> $GITHUB_OUTPUT
          echo "tag=v$NEXT"          >> $GITHUB_OUTPUT
          echo "range=$RANGE"        >> $GITHUB_OUTPUT
          echo "bump=$BUMP"          >> $GITHUB_OUTPUT
          echo "skip=false"          >> $GITHUB_OUTPUT
          echo "▶ $CURRENT → $NEXT  (bump: $BUMP, $COMMIT_COUNT commits)"


      # ── The engine ─────────────────────────────────────────────────────────────────────────────
      # Checked out AFTER the type check and the tests on purpose: those prove the public tree on its
      # own (the engine's CI proves the pair), and a checkout inside the workspace before `bun test`
      # would have the root test run pick up the engine's own suite. `.engine/` is gitignored and is
      # not a workspace (`packages/*`), so `bun install --frozen-lockfile` above never saw it.
      #
      # The ONE secret: ENGINE_DEPLOY_KEY — the private half of a READ-ONLY deploy key registered on
      # agentistics/agentistics-engine (and nowhere else). It grants nothing but reading that one
      # repository and survives this repository changing owner. Its absence on an official run is a
      # FAILED release, never a quiet community binary.
      - name: Read engine.pin
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        id: engine_pin
        env:
          HAS_ENGINE_KEY: ${{ secrets.ENGINE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_ENGINE_KEY" != "true" ]; then
            echo "::error::ENGINE_DEPLOY_KEY is not set — an official release cannot be built without the engine. Add the read-only deploy key of agentistics/agentistics-engine as this repository's ENGINE_DEPLOY_KEY secret."
            exit 1
          fi
          REF=$(jq -r .ref engine.pin)
          if ! echo "$REF" | grep -Eq '^[0-9a-f]{40}$|^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::engine.pin ref '$REF' is not a full commit SHA or a v<x.y.z> tag"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "▶ engine pinned at $REF (api $(jq -r .api engine.pin))"

      - name: Check out the engine at engine.pin
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: agentistics/agentistics-engine
          ref: ${{ steps.engine_pin.outputs.ref }}
          path: .engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      # The engine resolves `@agentistics/core` / `@agentistics/engine-api` from THIS checkout: its
      # postinstall (scripts/link-public.ts) links them from AGENTISTICS_PUBLIC_DIR.
      - name: Install + link the engine
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        working-directory: .engine
        env:
          AGENTISTICS_PUBLIC_DIR: ..
        run: bun install --frozen-lockfile

      - name: Bump version in package.json
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          bun -e "
            const fs = require('fs');
            const targets = process.env.PKG_FILES.split(' ').filter(Boolean);
            for (const f of targets) {
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Build frontend (Vite)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun run build

      # `build:assets` also regenerates the engine slot (packages/server/scripts/engine-slot.ts):
      # pointed at `.engine` on the official build, so every binary compiled below — glibc, musl,
      # Windows, both macOS ones, and the desktop sidecar that consumes the Windows one — carries it.
      - name: Embed frontend assets
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          AGENTISTICS_ENGINE_DIR: ${{ env.OFFICIAL == 'true' && '.engine' || '' }}
        run: |
          bun run build:assets
          if [ "$OFFICIAL" = "true" ] && ! grep -q "engineSlot = 'dir'" packages/server/server/engine-slot.generated.ts; then
            echo "::error::the engine slot does not point at the checked-out engine — refusing to build an official binary without it"
            exit 1
          fi

      # EVERY compile below is `--minify` (whitespace + syntax + identifiers) and NONE takes
      # `--sourcemap`: these binaries are public (GitHub Releases, the desktop installer), and an
      # unminified bundle carries the engine's source readable, module paths and all. Obfuscation
      # beyond minify is a separate, later decision. The smoke step greps the result for marker
      # strings an unminified engine carries (packages/server/scripts/assert-official-engine.ts).
      - name: Compile binary
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          mkdir -p release
          bun build --compile --minify packages/server/bin/cli.ts --outfile ./release/agentop

      # Alpine and other musl-based distros have no glibc dynamic linker at all — the glibc binary
      # above fails there with a bare "not found" that names no missing library (the kernel is
      # looking for /lib64/ld-linux-x86-64.so.2, which does not exist, and the shell reports that
      # ENOENT as though the file itself were missing). install.sh picks between the two by
      # checking `ldd --version` for "musl". Cross-compiled from this same glibc runner — Bun
      # downloads the musl runtime for the target rather than needing one installed here.
      - name: Compile musl binary (cross-compile)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun build --compile --minify --target=bun-linux-x64-musl packages/server/bin/cli.ts --outfile ./release/agentop-musl

      - name: Compile Windows binary (cross-compile)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun build --compile --minify --target=bun-windows-x64 packages/server/bin/cli.ts --outfile ./release/agentop.exe

      # Same cross-compile pattern as the musl and Windows binaries above — Bun downloads the
      # macOS runtime for each target rather than needing a macOS machine to build on. TWO
      # binaries because Apple Silicon and Intel Macs are different architectures with no
      # universal fallback the way glibc/musl share one ISA; install.sh picks between them off
      # `uname -m`.
      - name: Compile macOS binary (Intel, cross-compile)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun build --compile --minify --target=bun-darwin-x64 packages/server/bin/cli.ts --outfile ./release/agentop-darwin-x64

      - name: Compile macOS binary (Apple Silicon, cross-compile)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun build --compile --minify --target=bun-darwin-arm64 packages/server/bin/cli.ts --outfile ./release/agentop-darwin-arm64

      - name: Upload Windows binary artifact
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentop-windows-x64
          path: release/agentop.exe
          retention-days: 1

      - name: Smoke test
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: ./release/agentop --help

      # THE RELEASE FAILS IF THE ENGINE IS ABSENT. `--version` must print `engine <v> (api <x.y.z>)`
      # where <v> is the checked-out engine's own version (which is what tells it apart from the
      # transitional in-tree engine, reporting the host's) and <x.y.z> satisfies engine.pin's range.
      # It ALSO fails if the engine's source is readable in the binary: a module-header comment, an
      # internal function name or an engine module path still present means it was built without
      # --minify, or with a source map.
      - name: Smoke test — the official binary carries the pinned engine, minified
        if: env.OFFICIAL == 'true' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: bun packages/server/scripts/assert-official-engine.ts ./release/agentop --engine-dir .engine

      # The runner itself is glibc, so the musl binary cannot be exec'd directly here — it needs an
      # actual musl system. Alpine via Docker is the cheapest one, and it is also where the binary
      # needs libstdc++/libgcc (verified by hand: Bun's own runtime links them even in its musl
      # build, and Alpine's base image ships neither) — installing them here doubles as a check
      # that install.sh's own musl branch names the right packages.
      - name: Smoke test (musl)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          docker run --rm -e OFFICIAL="$OFFICIAL" -v "$(pwd)/release:/release:ro" alpine:latest sh -c '
            apk add --no-cache libstdc++ libgcc >/dev/null &&
            cp /release/agentop-musl /tmp/agentop-musl &&
            chmod +x /tmp/agentop-musl &&
            /tmp/agentop-musl --help >/dev/null &&
            if [ "$OFFICIAL" = "true" ]; then
              /tmp/agentop-musl --version | grep -Eq "^engine [0-9]" || { echo "::error::the musl binary carries no engine"; exit 1; }
            fi
          '

      # This runner is glibc/x86_64 Linux and can execute neither macOS binary — there is no
      # emulator here the way Docker gave the musl binary a real place to run. What CAN be
      # verified without a macOS machine is that Bun actually produced two DIFFERENT, genuine
      # Mach-O executables rather than, say, two copies of the same file or a truncated download:
      # `file` reads the Mach-O magic bytes and reports the architecture it finds. This is a
      # header check, not a functional smoke test — it would not catch a binary that starts and
      # then crashes. A real run needs a `runs-on: macos-latest` job, which this repo does not
      # have yet.
      - name: Verify macOS binaries (Mach-O header check — not a functional test)
        if: steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        run: |
          for f in ./release/agentop-darwin-x64 ./release/agentop-darwin-arm64; do
            echo "== $f =="
            file "$f"
          done
          file ./release/agentop-darwin-x64   | grep -qi 'Mach-O' || { echo "::error::agentop-darwin-x64 is not a Mach-O binary"; exit 1; }
          file ./release/agentop-darwin-arm64 | grep -qi 'Mach-O' || { echo "::error::agentop-darwin-arm64 is not a Mach-O binary"; exit 1; }
          file ./release/agentop-darwin-x64   | grep -qi 'x86_64' || { echo "::error::agentop-darwin-x64 is not x86_64"; exit 1; }
          file ./release/agentop-darwin-arm64 | grep -qi 'arm64'  || { echo "::error::agentop-darwin-arm64 is not arm64"; exit 1; }

      - name: Generate changelog
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          RANGE="${{ steps.version.outputs.range }}"
          VERSION="${{ steps.version.outputs.next }}"

          {
            echo "## What's changed in v${VERSION}"
            echo ""

            # `tformat:` (not `format:`) so the last record carries a terminal newline — otherwise
            # `while read` drops the oldest commit in the range and it vanishes from the changelog.
            git log "$RANGE" --pretty=tformat:"%s|%H" | while IFS='|' read -r subject sha; do
              short="${sha:0:7}"
              url="https://github.com/${{ github.repository }}/commit/${sha}"
              case "$subject" in
                feat:*)     echo "- ✨ ${subject#feat: } ([\`$short\`]($url))" ;;
                fix:*)      echo "- 🐛 ${subject#fix: } ([\`$short\`]($url))" ;;
                perf:*)     echo "- ⚡ ${subject#perf: } ([\`$short\`]($url))" ;;
                refactor:*) echo "- ♻️  ${subject#refactor: } ([\`$short\`]($url))" ;;
                chore:*)    echo "- 🔧 ${subject#chore: } ([\`$short\`]($url))" ;;
                docs:*)     echo "- 📚 ${subject#docs: } ([\`$short\`]($url))" ;;
                test:*)     echo "- 🧪 ${subject#test: } ([\`$short\`]($url))" ;;
                ci:*)       echo "- 👷 ${subject#ci: } ([\`$short\`]($url))" ;;
                *)          echo "- ${subject} ([\`$short\`]($url))" ;;
              esac
            done

            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo ""
            echo "Built from commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})."
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Commit version bump and create tag
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $PKG_FILES
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "$TAG"
          git push origin main "$TAG"

      # CARRY THE BUMP BACK TO `dev`. The step above commits the new version on `main` and nothing
      # ever brought it home, so `dev`'s own `package.json` stayed at whatever it said the last time
      # a bump reached it — 2.35.1, while `main` shipped 2.48.1, with 34 bump commits between them.
      # A build from `dev` serves the right CODE and stamps a version months old, so `/api/version`
      # reads as an old release: measured on this machine, a shipped feature was reported missing
      # four separate times because that number was the only evidence anybody had.
      #
      # A merge, not a cherry-pick: `main` receives nothing but merges of `dev` plus these bump
      # commits, so merging it into `dev` carries the bumps and nothing else. A CONFLICT is left
      # alone and announced — the release itself already succeeded, and a workflow that force-pushes
      # its way into a branch people are committing to is worse than a version number that lags.
      - name: Carry the version bump back to dev
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NEVER FATAL. Features now reach `main` straight from their work branches as well as `dev`,
        # so `dev` routinely moves while a release is running, and the push below was rejected as a
        # non-fast-forward — which failed the whole job AFTER the version was bumped and tagged, so
        # the release (binary, npm, image) was never published. Refetch and retry a few times; if
        # it still cannot land, warn and let the release publish — a lagging version number on `dev`
        # is the cost this step's own comment above already accepts.
        run: |
          carried=false
          for attempt in 1 2 3; do
            git fetch origin dev
            git checkout -B dev origin/dev
            if git merge --no-edit main; then
              if git push origin dev; then
                echo "▶ carried ${{ steps.version.outputs.next }} back to dev"
                carried=true
                break
              fi
              echo "push to dev rejected (attempt $attempt) — dev moved; refetching"
              sleep $((attempt * 5))
            else
              git merge --abort
              echo "::warning::could not merge main into dev — dev keeps its old version number until somebody merges it by hand"
              carried=true
              break
            fi
          done
          if [ "$carried" != true ]; then
            echo "::warning::could not push the version bump to dev after 3 attempts — dev keeps its old version number until somebody merges main into it"
          fi
          git checkout main

      # The VS Code extension, as an installable file on the release.
      #
      # It is how somebody without a marketplace account installs it:
      # `code --install-extension agentistics-vscode-<v>.vsix`. The extension carries its OWN
      # version (see PKG_FILES above), so the attached file says which extension shipped ALONGSIDE
      # this server release rather than claiming to be the same thing.
      #
      # `continue-on-error` on purpose: a failure to package an editor extension must not hold back
      # a server release. It stays visible in the run, and the attach below is skipped rather than
      # publishing a release with a broken asset.
      - name: Package the VS Code extension
        id: vsix
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        continue-on-error: true
        run: |
          bun run package:vscode
          echo "path=$(ls packages/vscode/*.vsix | head -1)" >> $GITHUB_OUTPUT

      - name: Publish versioned release + update latest
        if: github.ref == 'refs/heads/main' && steps.skip_check.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.next }}"
          # Empty when the packaging step failed — every command below then degrades to the binaries
          # rather than aborting a server release over an editor extension. Unquoted for exactly that
          # reason: quoted, an empty value becomes an empty ARGUMENT and `gh` refuses it.
          VSIX="${{ steps.vsix.outputs.path }}"

          # Create the versioned release (Linux binary only; Windows installer added by build-desktop job).
          # `gh release create` fails outright when the release already exists, which turns a
          # re-run — the normal response to a later job in this workflow failing — into a second
          # failure at the first step. Upload into it instead when it is already there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading the binaries into it"
            gh release upload "$TAG" ./release/agentop ./release/agentop-musl ./release/agentop-darwin-x64 ./release/agentop-darwin-arm64 ./release/agentop.exe $VSIX --clobber
          else
            gh release create "$TAG" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md \
              ./release/agentop \
              ./release/agentop-musl \
              ./release/agentop-darwin-x64 \
              ./release/agentop-darwin-arm64 \
              ./release/agentop.exe \
              $VSIX
          fi

          # Update the rolling latest pointer
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git tag latest
          git push origin latest

          # `--target` is REQUIRED here. Without it `gh release create` refuses a tag it cannot
          # yet see on the remote ("tag latest exists locally but has not been pushed"), and the
          # push immediately above has not necessarily propagated by the time this runs. That is
          # exactly how v1.7.4 failed: the old `latest` release had already been DELETED by the
          # line above, so the repository was left with no rolling release at all, and every job
          # after this one — the npm publish, the Windows installer, the GHCR image — was skipped.
          # Naming the commit lets gh create the release without waiting on tag propagation.
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes-file /tmp/release-notes.md \
            ./release/agentop \
            ./release/agentop-musl \
            ./release/agentop-darwin-x64 \
            ./release/agentop-darwin-arm64 \
            ./release/agentop.exe \
            $VSIX

  build-desktop:
    name: Build Tauri Desktop (Windows)
    runs-on: windows-latest
    needs: build
    if: needs.build.outputs.skip != 'true' && needs.build.outputs.version_skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile --cwd packages/desktop

      - name: Download agentop.exe artifact
        uses: actions/download-artifact@v8
        with:
          name: agentop-windows-x64
          path: packages/desktop/binaries/

      - name: Copy logo for loading screen
        shell: bash
        run: cp packages/web/public/minimalistLogo.png packages/desktop/ui/logo.png

      # The desktop job checks out the pre-bump commit, so set the version to the
      # same value the build job published. Otherwise the installer is built at the
      # old version while latest.json advertises the bumped one, which makes the
      # updater re-prompt forever (installed version never reaches the manifest one).
      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.next }}"
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Desktop build version set to $VERSION"

      - name: Build Tauri app
        working-directory: packages/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bunx tauri build --target x86_64-pc-windows-msvc

      - name: Check for updater signature
        id: check_sig
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SIG_FILE=$(find "$BUNDLE" -maxdepth 1 -name "*.exe.sig" 2>/dev/null | head -1)
          if [ -n "$SIG_FILE" ]; then
            echo "has_sig=true" >> $GITHUB_OUTPUT
          else
            echo "has_sig=false" >> $GITHUB_OUTPUT
            echo "::warning title=Auto-updater disabled::No .exe.sig produced — latest.json will not be generated and the native Tauri updater cannot detect this release. Check that the TAURI_SIGNING_PRIVATE_KEY secret is set AND that bundle.createUpdaterArtifacts is true in tauri.conf.json. (The in-app update banner still works.)"
          fi

      - name: Generate latest.json for auto-updater
        if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != '' && steps.check_sig.outputs.has_sig == 'true'
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          EXE=$(find "$BUNDLE" -maxdepth 1 -name "*.exe" ! -name "*.sig" | head -1)
          SIG=$(cat ${EXE}.sig)
          VERSION="${{ needs.build.outputs.next }}"
          TAG="${{ needs.build.outputs.tag }}"
          REPO="${{ github.repository }}"
          FILENAME=$(basename "$EXE")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${TAG} for full changelog.",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"
              }
            }
          }
          EOF

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentistics-windows-installer
          path: |
            packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          retention-days: 7

      - name: Attach installers to GitHub Release
        if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SIG_FILES=$(find "$BUNDLE" -maxdepth 1 -name "*.exe.sig" 2>/dev/null || true)
          LATEST_JSON=$([ -f /tmp/latest.json ] && echo /tmp/latest.json || true)
          gh release upload "$TAG" \
            $BUNDLE/*.exe \
            $SIG_FILES \
            $LATEST_JSON \
            --clobber || true

      - name: Attach installers to latest release
        if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BUNDLE=packages/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis
          SIG_FILES=$(find "$BUNDLE" -maxdepth 1 -name "*.exe.sig" 2>/dev/null || true)
          LATEST_JSON=$([ -f /tmp/latest.json ] && echo /tmp/latest.json || true)
          gh release upload latest \
            $BUNDLE/*.exe \
            $SIG_FILES \
            $LATEST_JSON \
            --clobber || true

  publish-mcp:
    name: Publish @agentistics/mcp to npm
    runs-on: ubuntu-latest
    needs: build
    # Trusted publishing: npm verifies THIS workflow's OIDC identity instead of a
    # stored credential, so there is no NPM_TOKEN to rotate. `id-token: write` is
    # what lets the runner mint that token — without it npm falls back to looking
    # for a credential and the publish fails as unauthenticated.
    #
    # The trusted publisher is configured per package on npmjs.com and pins the
    # repository AND this workflow's FILE NAME. Renaming this file, or moving the
    # publish into a different workflow, breaks the publish until the npm-side
    # configuration is updated to match.
    permissions:
      contents: read
      id-token: write
    # The MCP package follows the PROJECT's version, so every release publishes
    # it — including releases that changed nothing under packages/mcp. That is
    # the point: "agentistics 1.7.3" should ship "@agentistics/mcp 1.7.3", and
    # the previous rule (publish only when the package's own code changed, with
    # version bumps explicitly excluded from the diff) is why npm sat on 1.3.3
    # while the project reached 1.7.3. The cost is releases whose package is
    # byte-identical to the one before it, which is the intended trade.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.skip != 'true' &&
      needs.build.outputs.version_skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        run: |
          VERSION="${{ needs.build.outputs.next }}"
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/mcp/package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('packages/mcp/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Trusted publishing needs a recent npm CLI; the runner's bundled one is
      # older than the release that added OIDC support, and an old CLI fails by
      # looking for a credential rather than by saying the feature is missing.
      - name: Setup Node + npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Deliberately NO registry-url: it writes an .npmrc expecting
          # NODE_AUTH_TOKEN, and a credential present alongside OIDC is what
          # makes npm authenticate as the token instead of as this workflow.
      - name: Upgrade npm to a trusted-publishing build
        run: npm install -g npm@latest

      # Publishing on EVERY release makes "this version is already on npm" a
      # normal outcome rather than a fault: re-running a release, or retrying it
      # after a later job failed, would otherwise hit npm's publish conflict and
      # turn an otherwise-successful release red. Asked explicitly, so the step
      # below is skipped rather than failed.
      - name: Is this version already on npm?
        id: published
        run: |
          VERSION="${{ needs.build.outputs.next }}"
          if npm view "@agentistics/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "@agentistics/mcp@$VERSION is already published — nothing to do"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "@agentistics/mcp@$VERSION is new — publishing"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        working-directory: packages/mcp
        # No token, and no ~/.npmrc: npm mints its own short-lived credential
        # from the runner's OIDC identity. Provenance is attached automatically
        # on this path, so `--provenance` is not passed by hand.
        run: |
          npm --version
          bun run build
          npm publish --access public

  publish-npm-cli:
    name: Publish @agentistics/agentop to npm
    runs-on: ubuntu-latest
    needs: build
    # Same trusted-publishing setup as publish-mcp above (OIDC identity pinned to
    # this repo + this workflow FILE NAME on npmjs.com — renaming this file breaks
    # the publish until the npm-side trusted publisher is updated to match).
    permissions:
      contents: read
      id-token: write
    # @agentistics/agentop is a thin wrapper — its own code rarely changes — but it
    # publishes on EVERY release exactly like @agentistics/mcp, because its version
    # IS the promise of which GitHub Release binary its postinstall downloads. A
    # skipped release would leave the npm package pointing at a stale binary tag.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.skip != 'true' &&
      needs.build.outputs.version_skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        run: |
          VERSION="${{ needs.build.outputs.next }}"
          bun -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/agentop/package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('packages/agentop/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Trusted publishing needs a recent npm CLI; see the identical step in publish-mcp.
      - name: Setup Node + npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Upgrade npm to a trusted-publishing build
        run: npm install -g npm@latest

      # Same "already published" guard as publish-mcp — a retried/re-run release
      # must not turn npm's publish conflict into a red job.
      - name: Is this version already on npm?
        id: published
        run: |
          VERSION="${{ needs.build.outputs.next }}"
          if npm view "@agentistics/agentop@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "@agentistics/agentop@$VERSION is already published — nothing to do"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "@agentistics/agentop@$VERSION is new — publishing"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        working-directory: packages/agentop
        # No token, and no ~/.npmrc: npm mints its own short-lived credential
        # from the runner's OIDC identity. prepublishOnly runs the platform-
        # resolution unit tests; there is nothing to bundle — the CLI itself
        # is the versioned binary already uploaded to this release by `build`.
        run: |
          npm --version
          npm publish --access public

  # Build & push the central (Team Mode aggregator) image to GHCR so `agentop central`
  # can run from any machine WITHOUT cloning the repo — the CLI materializes a compose
  # that pulls `ghcr.io/agentistics/agentistics:<version>` instead of building from source.
  #
  # DUAL-PUBLISHED across the repository move (blpsoares/ -> agentistics/): every tag is pushed
  # to BOTH namespaces from ONE build, so both carry the same digest. Installs built before the
  # move pull `ghcr.io/blpsoares/agentistics` (their compose files name it), and a transfer
  # does NOT redirect GHCR the way it redirects the git and API URLs.
  #
  # One credential must be able to write both namespaces. GITHUB_TOKEN can only write the
  # repository owner's, so the second namespace needs `secrets.GHCR_PUBLISH_TOKEN` (a PAT with
  # write:packages, owned by an account that can publish to both) and `vars.GHCR_PUBLISH_USER`
  # (that account's login). Without them: after the transfer the job publishes
  # ghcr.io/agentistics only and SAYS so with a warning; before the transfer it FAILS, because
  # the CLI it ships pulls a namespace GITHUB_TOKEN cannot write from blpsoares/.
  publish-image:
    name: Publish central image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.skip != 'true' &&
      needs.build.outputs.version_skip != 'true'
    env:
      # THE IMAGE IS THE OFFICIAL BUILD TOO (leader decision Q-D): the same predicate as the build
      # job's, so that no artifact this workflow publishes — binary, installer or image — ships
      # without the engine. A fork's `main` builds the community image, exactly as before.
      OFFICIAL: ${{ github.repository == 'agentistics/agentistics' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}

    steps:
      # Check out main so the image includes the version-bump commit the build job pushed,
      # keeping the image's internal version aligned with the release tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # ── The engine, the same way the build job gets it (docs/official-build.md) ───────────────
      # Read from THIS checkout's engine.pin — main after the bump — so the image carries the very
      # engine the release's binaries carry. The Dockerfile receives it as a named build context
      # that is BIND-MOUNTED into the compile step and is never a layer; `.engine` is in
      # .dockerignore, so the ordinary `COPY . .` cannot carry it in either.
      - name: Read engine.pin
        if: env.OFFICIAL == 'true'
        id: engine_pin
        env:
          HAS_ENGINE_KEY: ${{ secrets.ENGINE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_ENGINE_KEY" != "true" ]; then
            echo "::error::ENGINE_DEPLOY_KEY is not set — the official image cannot be built without the engine."
            exit 1
          fi
          REF=$(jq -r .ref engine.pin)
          if ! echo "$REF" | grep -Eq '^[0-9a-f]{40}$|^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::engine.pin ref '$REF' is not a full commit SHA or a v<x.y.z> tag"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "▶ image engine pinned at $REF (api $(jq -r .api engine.pin))"

      - name: Check out the engine at engine.pin
        if: env.OFFICIAL == 'true'
        uses: actions/checkout@v4
        with:
          repository: agentistics/agentistics-engine
          ref: ${{ steps.engine_pin.outputs.ref }}
          path: .engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      # Only to run the release's own assertion script against the binary extracted from the image.
      - name: Setup Bun
        if: env.OFFICIAL == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image namespaces
        id: ns
        env:
          HAS_DUAL_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN != '' }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.next }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$HAS_DUAL_TOKEN" = "true" ]; then
            images="ghcr.io/agentistics/agentistics ghcr.io/blpsoares/agentistics"
          else
            images="ghcr.io/${owner}/agentistics"
            echo "::warning::GHCR_PUBLISH_TOKEN is not set — publishing ghcr.io/${owner}/agentistics only; the other namespace does not get v${VERSION}."
          fi
          tags=""
          for img in $images; do
            tags="${tags}${img}:${VERSION}"$'\n'"${img}:latest"$'\n'
          done
          {
            echo "images=${images}"
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUBLISH_TOKEN != '' && vars.GHCR_PUBLISH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      # BUILD, PROVE, THEN PUSH. The image is built and loaded locally first; on the official build
      # the Dockerfile already runs assert-official-engine.ts inside its compile step (so no image
      # can exist without passing it), and the step after this one runs it AGAIN from outside, on
      # the binary taken out of the finished image — the bytes that would actually be pushed — and
      # checks that no engine source file exists anywhere in the image. Only then is it pushed.
      - name: Build (load locally, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: agentistics:verify
          build-contexts: ${{ env.OFFICIAL == 'true' && 'engine=.engine' || '' }}
          build-args: ${{ env.OFFICIAL == 'true' && 'AGENTISTICS_OFFICIAL=1' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image's binary carries the pinned engine, minified, and no engine source
        if: env.OFFICIAL == 'true'
        run: |
          cid=$(docker create agentistics:verify)
          docker cp "$cid:/usr/local/bin/agentop" ./agentop-from-image
          docker rm "$cid" >/dev/null
          bun packages/server/scripts/assert-official-engine.ts ./agentop-from-image --engine-dir .engine
          leaked=$(docker run --rm --user root --entrypoint sh agentistics:verify -c "find / -xdev -path '*engine*src*' 2>/dev/null")
          if [ -n "$leaked" ]; then
            echo "::error::engine source files are present in the image:"; echo "$leaked"
            exit 1
          fi
          rm -f ./agentop-from-image
          echo "image verified: official engine present, no readable engine source, no engine source files"

      # ONE build, every tag: the same manifest is pushed to each namespace, so the digests match.
      # Same inputs as the verified build above, so every layer is a cache hit — and the Dockerfile's
      # own in-build assertion holds for this build as much as for that one.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ns.outputs.tags }}
          build-contexts: ${{ env.OFFICIAL == 'true' && 'engine=.engine' || '' }}
          build-args: ${{ env.OFFICIAL == 'true' && 'AGENTISTICS_OFFICIAL=1' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify every namespace carries the same digest
        env:
          IMAGES: ${{ steps.ns.outputs.images }}
          VERSION: ${{ needs.build.outputs.next }}
        run: |
          first=""
          for img in $IMAGES; do
            d="$(docker buildx imagetools inspect "${img}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "${img}:${VERSION} -> ${d}"
            if [ -z "$d" ]; then echo "::error::no digest for ${img}:${VERSION}"; exit 1; fi
            if [ -z "$first" ]; then first="$d"; elif [ "$d" != "$first" ]; then
              echo "::error::${img}:${VERSION} is ${d}, expected ${first}"; exit 1
            fi
          done
