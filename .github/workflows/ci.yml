# Continuous checks on every push and PR. `release.yml` runs tsc + tests too, but only on a
# tag push — which is far too late to learn that main is broken or that a dependency picked up
# a known vulnerability.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The paths in .github/frozen-engine-paths.txt are owned by the ENGINE repo
  # (agentistics/agentistics-engine) — a PR may not change them here. The one exception is the
  # ES.4 deletion PR: title tagged `[ES.4]` and only deletions under those paths. The checkout
  # is the PR's merge commit, so HEAD^1 is the base it merges into and the diff is the PR.
  frozen-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frozen engine paths
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun packages/server/scripts/frozen-paths-check.ts HEAD^1 HEAD

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # embedded-dist.generated.ts is a build artefact and is gitignored, so a fresh checkout
      # has no module for sse.ts to import. `stub` writes the type-only placeholder that makes
      # the tree typecheck without running the full web build (same step as release.yml).
      - name: Ensure type stub
        run: bun run stub

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Test
        run: bun test

      # The COMMUNITY build: the same tree with the NULL engine slot (packages/server/scripts/engine-slot.ts).
      # It must typecheck and its host side must hold — no integrations feeding the journal, the
      # engine verbs answered in a sentence, the reserved prefixes still guarded. The slot is put back
      # afterwards so the steps below run against the build they always ran against.
      - name: Community build (null engine slot)
        run: |
          bun run engine:slot:null
          bun tsc --noEmit
          bun test packages/server/server/engine packages/server/server/journal packages/server/server/capability-guard.test.ts packages/server/server/cli-journal.test.ts packages/server/server/health-journal.test.ts
          bun run engine:slot

      # The §40 parity matrix moved to the ENGINE repo's CI with the integrations it measures
      # (engine-interface spec §11 step 4).

      # The extension ships as two BUNDLES, and neither is produced by `tsc` or exercised by a
      # test: `dist/extension.cjs` for the extension host and `dist/webview.js` for the panel. A
      # bundler failure (an import that only resolves in the workspace, a browser target reaching
      # for a node builtin) typechecks perfectly clean and is only visible here.
      - name: Build the VS Code extension
        run: bun run build:vscode

      # Supply chain (OWASP A03). A high-severity advisory in a transitive dependency is a
      # finding about THIS app, not about someone else's package.
      #
      # Reported, not blocking — for now. The first run surfaced 21 pre-existing advisories in
      # production dependencies (protobufjs, fast-uri, hono, vite, brace-expansion), mostly DoS
      # and all transitive. Failing the build on those would hold every branch hostage to work
      # nobody has scheduled, so the step reports and CI stays green; tracked in issue #52.
      # Flip `continue-on-error` off once the backlog is clear — that is the point of it.
      - name: Audit dependencies
        continue-on-error: true
        run: bun audit --audit-level=high

      # `bun install` must not have rewritten the lockfile: a drifting lockfile means CI and
      # production are not installing the same tree.
      - name: Verify the lockfile is unchanged
        run: git diff --exit-code bun.lock

  # PERF.1: the performance budgets (scripts/perf/budgets.json) over a synthetic home — boot, the
  # first and warm /api/data, a history open, a file change reaching the dashboards, and a live
  # chat on a fake `claude` in tmux (send -> echo, answer -> shown). Fails when one is exceeded.
  perf-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure type stub
        run: bun run stub

      - name: tmux (the live-chat budgets run a fake claude in it)
        run: sudo apt-get install -y tmux

      - name: Synthetic home
        run: bun scripts/perf/synth-home.ts "$RUNNER_TEMP/perf-home" --scale 0.1

      - name: Perf budgets
        run: bun scripts/perf/budget.ts "$RUNNER_TEMP/perf-home"
