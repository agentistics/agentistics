# Run THIS machine (solo or member) in Docker.
#
# Reuses the application image and reads the host's harness dirs read-only while serving the
# dashboard. Configure the machine on the HOST first, then bring the container up — it mounts that
# same ~/.agentistics and inherits the local preferences.
#
#   agentop start           # pick "docker" in the launcher, or:
#   docker compose -f docker/machine.yml up -d --build
#
# Run the machine in Docker OR natively — not both at once (two members with the same token would
# push the same data and flap presence).
#
# Pinned so the project name does not come from this file's DIRECTORY. It used to sit at the repo
# root, where a bare `docker compose -f …` derived the project from the checkout folder; from
# `docker/` it would derive `docker`. Naming it makes the stack the same one wherever the command
# is run from — and if you ran the old root-level file, remove that container once
# (`docker rm -f <old>`) before bringing this one up: they share host networking and the ports.
name: agentistics-machine

services:
  machine:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agentistics-machine
    environment:
      # Read the HOST harness dirs mounted below, never the container's own home.
      CLAUDE_DIR: /host-claude
      CODEX_DIR: /host-codex
      GEMINI_DIR: /host-gemini
      COPILOT_DIR: /host-copilot
      # Antigravity (agy) lives inside the Gemini home, so /host-gemini already covers it;
      # ANTIGRAVITY_DIR defaults to <GEMINI_DIR>/antigravity-cli. Override only to relocate it.
      # PORT (api + mcp) 47291; the server also binds 47292 for the web dashboard.
      PORT: "47291"
      SERVE_STATIC: "1"
    volumes:
      - ${HOME}/.claude:/host-claude:ro
      - ${HOME}/.codex:/host-codex:ro
      - ${HOME}/.gemini:/host-gemini:ro
      - ${HOME}/.copilot:/host-copilot:ro
      # Read-write: preferences (team endpoint/token), the consolidate/archive store, sync state.
      #
      # /data/.agentistics, NOT /root/.agentistics. The image sets HOME=/data (see Dockerfile),
      # and the server resolves its data dir from HOME — so a mount at /root was a directory the
      # app never opened: the container silently ignored the host's endpoint and token and came
      # up as an unconfigured solo machine, which reads as "the member stopped pushing".
      #
      # Writing it needs a matching uid. The image runs as 10001 while this directory belongs to
      # the host user, so leave the mount read-write AND uncomment the `user:` line below if you
      # want the container to persist anything back (it is the same line the /proc note asks for).
      - ${HOME}/.agentistics:/data/.agentistics
    # Host networking lets the web (47292) and API (47291) land directly on the host.
    network_mode: host
    # Live sessions are detected by reading /proc. A container has its OWN pid namespace, so
    # without this it sees only itself and "Open now" is structurally empty — an assistant running
    # on the host is not merely absent, it is unobservable. `network_mode: host` does not help:
    # the pid namespace is a separate isolation.
    pid: host
    # `pid: host` alone is NOT sufficient, and this is the part that surprises. The process LIST
    # becomes visible, but `/proc/<pid>/cwd` and `/proc/<pid>/fd` are ptrace-gated: reading another
    # user's links needs a matching uid or CAP_SYS_PTRACE. The image runs as uid 10001 (see
    # Dockerfile) while the assistants run as the host user (usually 1000), so every cwd readlink
    # fails and the panel stays empty. The dashboard now SAYS so rather than showing a confident
    # zero — but to actually detect sessions, run the container as the host user by uncommenting
    # the line below (set the ids to `id -u` / `id -g` if yours are not 1000). This trades the
    # image's unprivileged-user hardening for the feature; that is a deliberate choice, not a
    # default.
    # user: "${AGENTISTICS_HOST_UID:-1000}:${AGENTISTICS_HOST_GID:-1000}"
    restart: unless-stopped
