# The team CENTRAL — from the PUBLISHED image, no checkout and no build.
#
#   agentop central up --image          # the CLI does all of this for you
#
# Raw compose:
#   docker compose -f docker/central.image.yml -f docker/central.localdb.yml \
#     --env-file central.env up -d --pull always --force-recreate
#
# This is the exact twin of docker/central.yml: same project name, same service name, same
# volume, same mount path, same hardening, same variables. Only where the image comes from
# differs, so one host can switch between building and pulling without losing its database or
# its preferences.
#
# `agentop central up` materialises this same file into ~/.agentistics/central/ when it is run
# outside a checkout — that is the no-repo path, and it is why this file exists in the repo at
# all: so what the binary generates is reviewable here rather than only inside a string.
#
# See docs/central-deploy.md (how to run one) and docs/exposure.md (how to publish one).

name: team-mode

services:
  app:
    # Defaults to :latest for a hand-driven compose run. `agentop central up` overrides it with
    # its OWN version, so the central always matches the CLI that deployed it; pin your own with
    # AGENTISTICS_IMAGE=ghcr.io/agentistics/agentistics:<tag>.
    image: ${AGENTISTICS_IMAGE:-ghcr.io/agentistics/agentistics:latest}
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-agentistics}
      AGENTISTICS_TEAM_CENTRAL: "1"
      AGENTISTICS_TEAM_ORG: ${AGENTISTICS_TEAM_ORG:-default}
      AGENTISTICS_TEAM_PASSWORD: ${AGENTISTICS_TEAM_PASSWORD:-}
      AGENTISTICS_TEAM_SESSION_SECRET: ${AGENTISTICS_TEAM_SESSION_SECRET:-}
      AGENTISTICS_TEAM_INGEST_TOKEN: ${AGENTISTICS_TEAM_INGEST_TOKEN:-}

      # --- Exposure ----------------------------------------------------------------------
      # Identical to docker/central.yml, and for the same reason: an exposure setting the
      # compose does not pass through is a setting that silently does nothing. This path used
      # to carry none of them, which made `AGENTISTICS_EXPOSURE=public` in central.env inert —
      # the instance kept the `lan` profile while its operator believed otherwise.
      # See docs/exposure.md.
      AGENTISTICS_EXPOSURE: ${AGENTISTICS_EXPOSURE:-}
      AGENTISTICS_ALLOW_LOCAL_SHELL: ${AGENTISTICS_ALLOW_LOCAL_SHELL:-}
      AGENTISTICS_TRUST_PROXY: ${AGENTISTICS_TRUST_PROXY:-}
      AGENTISTICS_TEAM_TLS: ${AGENTISTICS_TEAM_TLS:-}
      AGENTISTICS_ALLOWED_ORIGINS: ${AGENTISTICS_ALLOWED_ORIGINS:-}
      AGENTISTICS_INGEST_ONLY: ${AGENTISTICS_INGEST_ONLY:-}
      AGENTISTICS_OIDC_AUDIENCE: ${AGENTISTICS_OIDC_AUDIENCE:-}
      AGENTISTICS_OIDC_ISSUER: ${AGENTISTICS_OIDC_ISSUER:-}

      # Self-contribution needs host mounts, which this path deliberately does NOT have —
      # see docker/central.selfcontrib.yml, and prefer the build path for that setup.
      # Which tool brought this container up, so the in-container "lost your setup token"
      # banner can name a command that actually EXISTS on this host. It used to lead with
      # `./central.sh setup-token`, which the published-image path has no checkout for.
      AGENTISTICS_DEPLOY_HINT: "agentop"
      PORT: "47291"
      SERVE_STATIC: "1"
    volumes:
      # /data/.agentistics — the image runs as uid 10001 with HOME=/data (see Dockerfile).
      # This used to be /root/.agentistics, a path the app never writes to, so every
      # `up --force-recreate` (which is every `agentop central up`) threw the preferences away
      # and reopened the archive-consent gate on a central that had already answered it.
      - agentistics_data:/data/.agentistics
    ports:
      # Loopback by default, exactly like the build path. Widening it is a decision you make in
      # central.env, never one you inherit from a generated file.
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-48080}:47291"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:47291/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  agentistics_data:
